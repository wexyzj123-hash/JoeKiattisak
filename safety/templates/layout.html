{% extends "base.html" %}
{% block shell %}
<div class="shell">
  <aside class="sidebar">
    <div class="brand">AIAT Safety</div>
    {% for grp in nav %}
    <div class="nav-group">{{ grp.title }}</div>
    {% for i in grp.items %}<a class="nav-item{{ ' active' if i.active }}" href="{{ i.href }}">{{ i.label }}</a>{% endfor %}
    {% endfor %}
    <form method="post" action="/logout" class="nav-user">
      <span>{{ g.user['name'] }}</span>
      <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
      <button type="submit">ออกจากระบบ</button>
    </form>
  </aside>
  <main class="content">
    {% for m in get_flashed_messages() %}<div class="flash">{{ m }}</div>{% endfor %}
    {% block body %}{% endblock %}
  </main>
</div>
{% endblock %}
