{% block title %}AIAT Safety{% endblock %}
{% block body %}

  <h1>AIAT Safety</h1>
  <form method="post" action="/logout" style="display:flex;gap:10px;align-items:center">
    <span>{{ g.user['name'] }}</span>
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">

</header>
<p>เข้าสู่ระบบความปลอดภัยเรียบร้อย — ระบบกำลังพัฒนาตามเฟส</p>
{% endblock %}
