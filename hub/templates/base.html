<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}AIAT Hub{% endblock %}</title>
<link rel="stylesheet" href="/static/theme.css">
<link rel="stylesheet" href="/static/hub/scene.css">
<script src="/static/theme.js"></script>
</head>
<body>
{% block toggle %}<button type="button" class="theme-toggle theme-fixed" data-theme-toggle aria-label="สลับธีมสว่าง/มืด" title="สลับธีมสว่าง/มืด"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg></button>{% endblock %}
{% block shell %}<main class="wrap">
{% for m in get_flashed_messages() %}<div class="flash">{{ m }}</div>{% endfor %}
{% block body %}{% endblock %}
</main>{% endblock %}
</body>
</html>
