name: windows-test
# ทดสอบ E-Checksheet บน Windows จริง: แตกไฟล์ zip เวอร์ชันล่าสุด → ชุดทดสอบทั้งหมดด้วย run_tests.bat →
# ใส่ข้อมูลตัวอย่าง → เปิดเซิร์ฟเวอร์จริง (python run.py) → Microsoft Edge กดดูทุกหน้า + สร้าง PDF ด้วย Edge
on:
  push:
    branches: [claude/sharp-tesla-iwjskz]
    paths: ["*.zip", ".github/**"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: ตั้งเขตเวลาเครื่องเป็นประเทศไทย (เหมือนเครื่องที่โรงงาน)
        run: |
          tzutil /s "SE Asia Standard Time"
          tzutil /g
          Get-Date

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: แตกไฟล์เวอร์ชันล่าสุด
        run: |
          $zip = Get-ChildItem E-Checksheet_69_v*.zip | Sort-Object { [version]($_.BaseName -replace '.*_v', '') } | Select-Object -Last 1
          "ZIP=$($zip.Name)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Expand-Archive $zip.FullName -DestinationPath work
          Write-Host "ทดสอบ $($zip.Name)"
          "### ไฟล์ที่ทดสอบ: $($zip.Name) · Python ${{ matrix.python }} · $(tzutil /g)" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: ชุดทดสอบทั้งหมด (run_tests.bat)
        working-directory: work/E-Checksheet
        shell: cmd
        run: call run_tests.bat

      - name: ใส่ข้อมูลตัวอย่าง + เปิดเซิร์ฟเวอร์จริง + Microsoft Edge กดดูทุกหน้า + PDF / Excel
        # ขั้นเดียวกัน: Windows runner ปิดโปรเซสที่เปิดค้างไว้เมื่อจบแต่ละขั้น — เซิร์ฟเวอร์ต้องอยู่ขั้นเดียวกับการทดสอบ
        working-directory: work/E-Checksheet
        run: |
          .\.venv\Scripts\python.exe run.py --demo
          .\.venv\Scripts\python.exe -m pip install -q playwright
          New-Item -ItemType Directory -Force ..\..\win-out | Out-Null
          $p = Start-Process -FilePath .\.venv\Scripts\python.exe -ArgumentList "run.py" -RedirectStandardOutput ..\..\win-out\server.log -RedirectStandardError ..\..\win-out\server.err -PassThru -WindowStyle Hidden
          $ready = $false
          for ($i = 0; $i -lt 60; $i++) {
            try { $r = Invoke-WebRequest -Uri http://127.0.0.1:5100/login -UseBasicParsing -TimeoutSec 5; if ($r.StatusCode -eq 200) { $ready = $true; break } } catch { }
            Start-Sleep -Seconds 2
          }
          if (-not $ready) { Get-Content ..\..\win-out\server.log, ..\..\win-out\server.err; exit 1 }
          Write-Host "เซิร์ฟเวอร์พร้อม (PID $($p.Id))"
          .\.venv\Scripts\python.exe ..\..\.github\win\smoke.py http://127.0.0.1:5100 ..\..\win-out
          $code = $LASTEXITCODE
          if ($p.HasExited) { Write-Host "เซิร์ฟเวอร์หยุดทำงานระหว่างทดสอบ (exit $($p.ExitCode))" }
          if ($code -ne 0 -or $p.HasExited) { Write-Host "---- server.err ----"; Get-Content ..\..\win-out\server.err -Tail 60 }
          Stop-Process -Id $p.Id -ErrorAction SilentlyContinue
          exit $code

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-py${{ matrix.python }}
          path: win-out
          if-no-files-found: ignore
